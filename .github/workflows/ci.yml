name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: .node-version
          cache: true
      - run: vp install --frozen-lockfile
      # The OG images are rendered with Playwright's Chromium at build time.
      - run: vp exec playwright install --with-deps chromium
      - run: vpr build

  vrt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: .node-version
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp exec playwright install --with-deps chromium
      # Skips until Linux baselines have been seeded with the
      # "Update VRT snapshots" workflow (local macOS baselines
      # use a different platform suffix and don't count).
      - name: Run visual regression tests
        if: hashFiles('tests/vrt/__screenshots__/*-linux/**') != ''
        run: vpr vrt
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
