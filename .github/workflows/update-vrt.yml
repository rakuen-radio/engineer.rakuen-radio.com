name: Update VRT snapshots

# Regenerates the visual regression baselines on Linux (the CI platform)
# and commits them to the branch the workflow was dispatched on.
on:
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec vp run vrt-update
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/vrt/__screenshots__
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "test: update VRT snapshots"
            git push
          fi
