name: Update VRT snapshots

# Regenerates the visual regression baselines on Linux (the CI platform)
# and commits them to the branch the workflow was dispatched on.
on:
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version-file: .node-version
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp exec playwright install --with-deps chromium
      - run: vpr vrt-update
      - run: vpr vrt-commit
