name: Update VRT snapshots

# Regenerates the visual regression baselines on Linux (the CI platform)
# and commits them to the branch the workflow was dispatched on.
on:
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: .node-version
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp exec playwright install --with-deps chromium
      - run: vpr vrt-update
      - run: vpr vrt-commit
