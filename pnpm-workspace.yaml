catalog:
  "@ox-content/theme-color-voltage": 3.2.8
  "@ox-content/theme-voltage": 3.2.8
  "@ox-content/vite-plugin": 3.2.8
  "@playwright/test": ^1.63.0
  "@types/node": ^26.6.2
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  wrangler: ^4.135.0
allowBuilds:
  esbuild: true
  # puppeteer is pulled in via @mermaid-js/mermaid-cli (unused: no mermaid
  # diagrams on this site); keep its Chrome download disabled.
  puppeteer: false
  workerd: true
minimumReleaseAgeExclude:
  # Every @ox-content release is younger than the policy cutoff at the
  # moment it is picked up; the rest of the tree is not.
  - "@ox-content/*"
  - "@voidzero-dev/vite-plus-core@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0"
  - vite-plus@1.0.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
